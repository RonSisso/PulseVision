# Tooling configuration for PulseVision.
#
# Linting/formatting are currently enforced on the actively-developed
# signal-processing code and the tests; the GUI/database modules are excluded
# for now and can be brought under the tools incrementally.

[project]
name = "pulsevision"
version = "0.1.0"
description = "Real-time contactless heart rate measurement from webcam video (rPPG)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
extend-exclude = [
    "src/gui",
    "src/database",
    "src/face_detection",
    "src/video",
    "src/utils",
    "src/main.py",
]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (real errors), I: import order, B: bugbear,
# UP: pyupgrade. E501 (line length) is left to the formatter.
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "src/(gui|database|face_detection|video|utils)|src/main\\.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
