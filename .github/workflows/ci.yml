name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: implementation

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools and signal-processing dependencies
        run: |
          python -m pip install --upgrade pip
          # Only what the linters and the DSP tests need — the GUI/MediaPipe
          # stack is not exercised in CI. opencv-python-headless avoids the
          # system OpenGL libraries the full opencv build pulls in.
          pip install numpy scipy opencv-python-headless
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Tests (pytest)
        run: pytest -q
